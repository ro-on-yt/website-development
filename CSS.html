<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"
    <meta name="viewport" name="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        h2{
            color:blue;
        }
    </style>
</head>
<body
   <!--In inline CSS we use style attribute in the opening tag of HTML elements-->
   <h1 style="color:red ;">Inline CSS </h1>
   <!--In internal CSS we use style elements in head section of HTMl structure-->
   <h2>Internal CSS</h2>
</body>
</html>
